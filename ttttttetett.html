<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>أهلاً بك في جلال دبي للأزياء</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0b2440, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #020617;
      border: 1px dashed rgba(255,255,255,0.25);
      border-radius: 12px;
      color: #fff;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      margin-bottom: 18px;
    }

    button:hover {
      opacity: 0.9;
    }

    footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .credit {
      font-size: 12px;
      opacity: 0.7;
    }

    .instagram-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .instagram-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>أهلاً بك في جلال دبي للأزياء</h1>
    <p>ارفع الفيديو ليتم استلامه ومعالجته تلقائيًا</p>

    <form id="uploadForm">
      <input type="file" id="video" name="data" accept="video/*" required />
      <button type="submit">رفع الفيديو</button>
    </form>

    <footer>
      <span class="credit">made by Ahmed Ali</span>

      <a
        class="instagram-btn"
        href="https://www.instagram.com/8jy8/"
        target="_blank"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M7.75 2h8.5C19.55 2 22 4.45 22 7.75v8.5C22 19.55 19.55 22 16.25 22h-8.5C4.45 22 2 19.55 2 16.25v-8.5C2 4.45 4.45 2 7.75 2Zm0 2C5.68 4 4 5.68 4 7.75v8.5C4 18.32 5.68 20 7.75 20h8.5c2.07 0 3.75-1.68 3.75-3.75v-8.5C20 5.68 18.32 4 16.25 4h-8.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/>
        </svg>
        Instagram
      </a>
    </footer>

  </div>

  <script>
    const form = document.getElementById('uploadForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById('video');
      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append('data', fileInput.files[0]);

      // ✅ الرابط الجديد
      await fetch(
        'https://jalaldubai.app.n8n.cloud/webhook/up',
        {
          method: 'POST',
          body: formData
        }
      );

      alert('تم رفع الفيديو بنجاح ✅');
      form.reset();
    });
  </script>

</body>
</html>
